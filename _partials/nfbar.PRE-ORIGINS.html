<!-- ═══ NoFilter shared nav chrome — "nfbar" ═══════════════════════════════════
     Injected as a shared partial (name: nfbar). Verbatim from the v256 Generic nfbar block
     (CSS ~1639-1718, JS ~5698-5749) + the logomark unfurl (crop/lk-* rules) and its
     3.2s auto-collapse (Generic ~6403). Single source of truth — edit here, re-stamp everywhere.
     Relies on host :root tokens (--nf-*, --font-display, --nf-white/-cream/-orange).
     Behaviour: transparent over the cover → solid near-black (is-stuck) on scroll; hides on
     scroll-down, returns on scroll-up with a 1.1s idle-fade; hides while a .choice-scroll
     immersive section fills the viewport. Logomark unfurls on load, collapses to the "+" after
     3.2s, re-opens on hover. Progress bar tracks scroll.
     HOST SLOT: the .nfbar-nav / .nfbar-mobile <a> items are the per-page customisable part. -->
<style id="nf-nfbar">
.nfbar{position:absolute;top:0;left:0;right:0;z-index:900;
  display:flex;align-items:center;gap:24px;
  padding:26px clamp(20px,4vw,48px);
  transform:translateY(0);opacity:1;
  transition:transform .5s cubic-bezier(.22,.7,.25,1),opacity .5s ease,background .3s ease,padding .3s ease,box-shadow .3s ease;}
.nfbar.is-stuck{position:fixed;padding-top:14px;padding-bottom:14px;
  background:var(--nf-near-black);box-shadow:0 1px 0 rgba(255,232,195,.10);}
.nfbar.nfbar-hidden{transform:translateY(-10px);opacity:0;pointer-events:none;}
.nfbar-lockup{display:inline-flex;align-items:center;flex:0 0 auto;text-decoration:none;height:60px;gap:7px;}
.nfbar-lockup:hover{gap:11px;}
.lk-nf-crop{overflow:hidden;height:52px;width:42px;transition:width .6s cubic-bezier(.76,0,.24,1);}
.lk-nf-svg{height:52px;display:block;margin-left:-147px;transition:margin-left .6s cubic-bezier(.76,0,.24,1);}
.lk-plus{fill:#ed3326;}
.lk-lt,.lk-rt{fill:#F4F2EE;opacity:0;transition:opacity .6s cubic-bezier(.76,0,.24,1),transform .6s cubic-bezier(.76,0,.24,1);transform-box:fill-box;}
.lk-lt{transform:translateX(45px);transform-origin:right center;}
.lk-rt{transform:translateX(-34px);transform-origin:left center;}
.nfbar-lockup:hover .lk-nf-crop,.nfbar-lockup.lk-open .lk-nf-crop{width:262px;}
.nfbar-lockup:hover .lk-nf-svg,.nfbar-lockup.lk-open .lk-nf-svg{margin-left:0;}
.nfbar-lockup:hover .lk-lt,.nfbar-lockup:hover .lk-rt,.nfbar-lockup.lk-open .lk-lt,.nfbar-lockup.lk-open .lk-rt{opacity:1;transform:translateX(0);}
/* static logomark (non-home pages): lock to the "+" mark — no unfurl on load, no hover-expand. Add class="nf-logo-static" on <body>. Homepage omits it and keeps the full animation. */
.nf-logo-static .nfbar-lockup:hover,.nf-logo-static .nfbar-lockup.lk-open{gap:7px;}
.nf-logo-static .nfbar-lockup:hover .lk-nf-crop,.nf-logo-static .nfbar-lockup.lk-open .lk-nf-crop{width:42px;}
.nf-logo-static .nfbar-lockup:hover .lk-nf-svg,.nf-logo-static .nfbar-lockup.lk-open .lk-nf-svg{margin-left:-147px;}
.nf-logo-static .nfbar-lockup:hover .lk-lt,.nf-logo-static .nfbar-lockup:hover .lk-rt,.nf-logo-static .nfbar-lockup.lk-open .lk-lt,.nf-logo-static .nfbar-lockup.lk-open .lk-rt{opacity:0;}
.nfbar-nav{display:flex;align-items:center;gap:2px;margin-left:auto;}
.nfbar-item{font-family:var(--font-display);font-weight:700;
  font-size:15px;letter-spacing:.01em;text-transform:uppercase;
  color:#F4F2EE;text-decoration:none;
  padding:8px 13px;border-radius:2px;white-space:nowrap;
  transition:color .18s ease,background .18s ease;}
.nfbar-item:hover,.nfbar-item:focus-visible{color:var(--nf-orange,#ed3326);}
.nfbar-cta{font-family:var(--font-display);font-weight:700;
  font-size:15px;letter-spacing:.02em;text-transform:uppercase;
  color:var(--nf-white);text-decoration:none;flex:0 0 auto;margin-left:8px;
  padding:9px 18px;background:var(--nf-orange);border-radius:2px;white-space:nowrap;
  transition:background .18s ease;}
.nfbar-cta:hover{background:var(--nf-orange-hover);}
.nfbar-burger{display:none;flex:0 0 auto;margin-left:14px;width:34px;height:26px;
  background:none;border:none;padding:0;cursor:pointer;position:relative;}
.nfbar-burger span{display:block;position:absolute;left:0;right:0;height:3px;background:var(--nf-cream);
  border-radius:2px;transition:transform .25s ease,opacity .2s ease,top .25s ease;}
.nfbar-burger span:nth-child(1){top:2px;}
.nfbar-burger span:nth-child(2){top:11px;}
.nfbar-burger span:nth-child(3){top:20px;}
.nfbar-burger.is-open span:nth-child(1){top:11px;transform:rotate(45deg);}
.nfbar-burger.is-open span:nth-child(2){opacity:0;}
.nfbar-burger.is-open span:nth-child(3){top:11px;transform:rotate(-45deg);}
.nfbar-mobile{position:fixed;inset:0;z-index:899;background:var(--nf-near-black);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;}
.nfbar-mobile.is-open{opacity:1;visibility:visible;}
.nfbar-mobile nav{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,36px);}
.nfbar-mobile a{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,8vw,52px);
  text-transform:uppercase;letter-spacing:-.01em;color:var(--nf-cream);text-decoration:none;
  transition:color .15s ease;}
.nfbar-mobile a:hover{color:var(--nf-orange);}
.nfbar-mobile-cta{margin-top:clamp(8px,2vh,16px);color:var(--nf-orange)!important;}
@media(max-width:860px){
  .nfbar{gap:14px;padding-left:18px;padding-right:18px;}
  .nfbar-nav,.nfbar-cta{display:none;}
  .nfbar-burger{display:block;}
}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--nf-orange);width:0;z-index:950;transition:width .1s linear;}
/* shared cart affordance — persistent "it's in your cart" signal + the path to checkout.
   Colour inherits (currentColor) so cream-nav pages can flip it dark while the bar is transparent. */
.nfbar-cart{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:42px;margin-left:4px;background:none;border:none;padding:0;cursor:pointer;
  color:#F4F2EE;border-radius:4px;transition:color .18s ease;}
.nfbar-cart:hover{color:var(--nf-orange);}
.nfbar-cart svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;}
.nfbar-cart-n{position:absolute;top:1px;right:0;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;
  border-radius:99px;background:var(--nf-orange);color:#fff;font-family:var(--font-b,Archivo,sans-serif);
  font-weight:700;font-size:10px;line-height:18px;text-align:center;pointer-events:none;
  transform:scale(0);transition:transform .22s cubic-bezier(.34,1.6,.64,1);}
.nfbar-cart-n.has{transform:scale(1);}
.nfbar-cart-n.bump{animation:nfCartBump .38s ease;}
@keyframes nfCartBump{0%{transform:scale(1);}45%{transform:scale(1.55);}100%{transform:scale(1);}}
.nfbar-cart.ring::after{content:"";position:absolute;inset:4px;border-radius:99px;border:2px solid var(--nf-orange);opacity:0;animation:nfCartRing .6s ease-out;}
@keyframes nfCartRing{0%{opacity:.85;transform:scale(.85);}100%{opacity:0;transform:scale(1.5);}}
@media(max-width:860px){.nfbar-cart{margin-left:auto;}}
</style>

<script>
/* progress bar + is-stuck + show-on-scroll-up (verbatim from v256 Generic; the immersive
   force-hide now keys on any .choice-scroll section rather than a hardcoded id, so the
   partial is portable across pages). */
(function(){
  var prog  = document.getElementById('progress');
  var nfbar = document.getElementById('nfbar');
  var immersive = document.querySelector('.choice-scroll');
  function onScroll(){
    var d = document.documentElement;
    var max = d.scrollHeight - d.clientHeight;
    var y = window.scrollY || d.scrollTop;
    if(prog) prog.style.width = (max>0 ? (y/max*100) : 0) + '%';
    if(nfbar){
      nfbar.classList.toggle('is-stuck', y>12);
      // Accumulate scroll movement in one direction; flip only past a threshold. This hides on a sustained
      // scroll DOWN (even slow), returns on a sustained scroll UP, and ignores trackpad jitter. Always shown at top.
      var lastY = (window.__nfLastY==null ? y : window.__nfLastY);
      var dy = y - lastY; window.__nfLastY = y;
      var acc = window.__nfAcc || 0;
      if(dy>0 && acc<0) acc=0; else if(dy<0 && acc>0) acc=0;   // direction reversed → reset accumulator
      acc += dy; window.__nfAcc = acc;
      var shown = (window.__nfShown==null ? true : window.__nfShown);
      if(y < 40) shown=true;
      else if(acc > 12) shown=false;   // ~12px accumulated down → hide
      else if(acc < -12) shown=true;   // ~12px up → show
      window.__nfShown = shown;
      var show = shown;
      if(immersive){ var r=immersive.getBoundingClientRect(); if(r.top<=2 && r.bottom>=window.innerHeight-2) show=false; }
      nfbar.classList.toggle('nfbar-hidden', !show);
    }
  }
  document.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  onScroll();
})();

/* logomark: unfurl on load, collapse to the + after 3.2s (hover re-opens) — Generic ~6403 */
(function(){
  var lk=document.querySelector('.nfbar-lockup');
  if(!lk) return;
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  setTimeout(function(){ lk.classList.remove('lk-open'); }, 3200);
})();

/* mobile hamburger — verbatim from v256 Generic */
(function(){
  var burger=document.getElementById('nfbarBurger');
  var panel =document.getElementById('nfbarMobile');
  if(!burger||!panel) return;
  function setOpen(open){
    burger.classList.toggle('is-open',open);
    panel.classList.toggle('is-open',open);
    burger.setAttribute('aria-expanded',open?'true':'false');
    panel.setAttribute('aria-hidden',open?'false':'true');
    burger.setAttribute('aria-label',open?'Close menu':'Open menu');
    document.body.style.overflow=open?'hidden':'';
  }
  burger.addEventListener('click',function(){setOpen(!panel.classList.contains('is-open'));});
  panel.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setOpen(false);});});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
})();

/* shared cart — single source of truth for the nav badge across pages.
   The shop drives it with window.NFCart.setQty(id, qty, meta). Persists via localStorage so the
   count survives navigation; total = sum of every line's qty. Emits 'nfcart:change' for any listener
   (e.g. a cart drawer) to re-render. */
(function(){
  var KEY='nf_cart_v1';
  // BUILD-TIME: session-only cart — starts empty on every reload so stale test items don't linger.
  // Flip PERSIST=true before launch to restore a real cart that survives reloads + navigation.
  var PERSIST=false;
  var mem={items:{}};
  if(!PERSIST){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function read(){ if(PERSIST){ try{ return JSON.parse(localStorage.getItem(KEY))||{items:{}}; }catch(e){ return {items:{}}; } } return mem; }
  function save(s){ if(PERSIST){ try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){} } else { mem=s; } }
  function total(s){ var n=0,k; for(k in s.items){ n+=(s.items[k].qty||0); } return n; }
  var badge=document.getElementById('nfbarCartN');
  var btn=document.getElementById('nfbarCart');
  function render(pulse){
    if(!badge) return;
    var n=total(read());
    badge.textContent=n;
    badge.classList.toggle('has', n>0);
    if(pulse){
      badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump');
      if(btn){ btn.classList.remove('ring'); void btn.offsetWidth; btn.classList.add('ring'); }
    }
  }
  window.NFCart={
    read:read,
    total:function(){ return total(read()); },
    lines:function(){ var s=read(),a=[],k; for(k in s.items){ a.push(Object.assign({id:k},s.items[k])); } return a; },
    setQty:function(id,qty,meta){
      var s=read();
      if(qty>0){ s.items[id]=Object.assign({},meta||{},{qty:qty}); } else { delete s.items[id]; }
      save(s);
      render(qty>0);
      window.dispatchEvent(new CustomEvent('nfcart:change',{detail:{items:s.items,total:total(s)}}));
    },
    getQty:function(id){ var s=read(); return (s.items[id]&&s.items[id].qty)||0; },
    clear:function(){ if(PERSIST){ try{ localStorage.removeItem(KEY); }catch(e){} } else { mem={items:{}}; } render(false); }
  };
  if(btn){ btn.addEventListener('click',function(){ window.dispatchEvent(new CustomEvent('nfcart:open')); }); }
  window.addEventListener('storage',function(e){ if(e.key===KEY) render(false); });
  render(false);
})();
</script>
