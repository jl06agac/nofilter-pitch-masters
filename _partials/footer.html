     Restyled to the v256 Generic colophon: near-black, centred, big NoFilter wordmark + mono fine print.
     Wordmark SVG harvested verbatim from the Generic build. Keeps the market switch + shared .rv reveal JS.
     Relies on host :root tokens (--nb,--or,--font-m). -->
<style id="nf-footer">
footer.nf-colophon{background:var(--nb);color:rgba(255,232,195,.72);padding:clamp(28px,3vw,42px) 0;}
.colophon-inner{max-width:1160px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;}
.colophon-logo{display:block;width:150px;max-width:42vw;height:auto;}
.colophon-meta{font-family:var(--font-m);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,232,195,.55);}
.colophon-nav{display:flex;gap:clamp(14px,2vw,30px);flex-wrap:wrap;justify-content:center;margin-top:2px;}
.colophon-nav a{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,232,195,.7);text-decoration:none;transition:color .15s;}
.colophon-nav a:hover{color:#fff;}
.foot-mkt{display:flex;gap:8px;justify-content:center;margin-top:2px;}
.foot-mkt button{font-family:var(--font-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid rgba(255,232,195,.24);color:rgba(255,232,195,.7);padding:7px 14px;border-radius:99px;cursor:pointer;transition:.15s;}
.foot-mkt button.on,.foot-mkt button:hover{border-color:var(--or);color:#fff;}
.colophon-fine{font-family:var(--font-m);font-size:10px;line-height:1.6;letter-spacing:.02em;color:rgba(255,232,195,.34);max-width:120ch;margin:8px auto 0;}
</style>

<script>
/* shared scroll reveals (.rv) */
(function(){
  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){ els.forEach(function(el){el.classList.add('in');}); return; }
  var io=new IntersectionObserver(function(entries){ entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target);} }); },{threshold:.15});
  els.forEach(function(el){ io.observe(el); });
})();
</script>
